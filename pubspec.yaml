name: iecc
#android version
#version: 1.0.3+100030
#ios version:
version: 1.0.4+100040
publish_to: none
description: A new Flutter project.
environment:
  sdk: '>=3.4.0-24.0.dev <4.0.0'

dependencies: 
  cupertino_icons: ^1.0.6
  get_cli: ^1.6.0
  get: ^4.6.6
  flutter: 
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  flutter_secure_storage: ^8.0.0
  http: ^1.2.0
  flutter_svg: ^2.0.9
#  timer_count_down: ^2.2.2
#  flutter_timer_countdown: ^1.0.7
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  cached_network_image: ^3.3.1
  intl: ^0.18.0
  flutter_launcher_icons: ^0.13.1
  shimmer: ^3.0.0
  flutter_native_splash: ^2.3.10
  drop_down_search_field: ^1.0.3
  font_awesome_flutter: ^10.7.0
  carousel_slider: ^4.2.1
  share_plus: ^9.0.0
  url_launcher: ^6.2.6


dev_dependencies: 
  flutter_lints: ^4.0.0
  flutter_test: 
    sdk: flutter

flutter: 
  uses-material-design: true

  fonts:
    - family: Cabin
      fonts:
        - asset: assets/fonts/Cabin-Bold.ttf
        - asset: assets/fonts/Cabin-BoldItalic.ttf
        - asset: assets/fonts/Cabin-Italic.ttf
        - asset: assets/fonts/Cabin-Medium.ttf
        - asset: assets/fonts/Cabin-MediumItalic.ttf
        - asset: assets/fonts/Cabin-Regular.ttf
        - asset: assets/fonts/Cabin-SemiBold.ttf
        - asset: assets/fonts/Cabin-SemiBoldItalic.ttf


    - family: ProximaNovaFont
      fonts:
        - asset: assets/fonts/proxima_nova_font.otf
        - asset: assets/fonts/ProximaNova-Black.ttf
        - asset: assets/fonts/ProximaNova-Bold.ttf
        - asset: assets/fonts/ProximaNova-Extrabld.ttf
        - asset: assets/fonts/ProximaNova-Light.ttf
        - asset: assets/fonts/ProximaNova-Regular.ttf
        - asset: assets/fonts/ProximaNova-Semibold.ttf
        - asset: assets/fonts/ProximaNovaT-Thin.ttf

  assets:
    - assets/
    - assets/icons/
    - assets/logo/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#000000" # only available for Android 8.0 devices and above
  #adaptive_icon_background: "assets/logo/bg.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/icons/launcher_icon.png" # only available for Android 8.0 devices and above
  adaptive_icon_monochrome: "" # only available for Android 13 devices and above
 # remove_alpha_ios: true
  background_color_ios: "#000000"

flutter_native_splash:
  color: "#DE0023"
  image: assets/logo/splash_screen.png
  # branding: assets/logo/launcher_icon.png
  color_dark: "#DE0023"
  image_dark: assets/logo/splash_screen.png
  # branding_dark: assets/logo/launcher_icon.png

  android_12:
    image: assets/logo/splash_screen.png
    icon_background_color: "#DE0023"
    image_dark: assets/logo/splash_screen.png
    icon_background_color_dark: "#DE0023"

  web: false

